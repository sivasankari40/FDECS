name: Application checks
"on":
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    services:
      couchdb:
        image: couchdb:3.5.2
        env:
          COUCHDB_USER: ci_admin
          COUCHDB_PASSWORD: ci-only-not-production
        ports:
          - 5984:5984
        options: >-
          --health-cmd "curl -fsS http://localhost:5984/_up"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 6
    env:
      APP_ENV: development
      COUCHDB_URL: http://127.0.0.1:5984
      COUCHDB_USER: ci_admin
      COUCHDB_PASSWORD: ci-only-not-production
      COUCHDB_DATABASE: solari_ci_tickets
      RUN_COUCHDB_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      # CPU-only torch first; the default Linux wheel pulls several GB of GPU libraries.
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements-dev.txt
      # The model is committed under models/, so semantic tests run without a download. Includes the hybrid-retrieval quality bar (Recall@3, abstention, zero irrelevant results).
      - run: python -W default::DeprecationWarning -m pytest -q --tb=short
      - run: python -m support_assistant.evaluation --split heldout > heldout.json
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-evaluation-${{ matrix.python }}
          path: heldout.json
